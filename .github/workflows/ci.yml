name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Test all packages
        run: pnpm test

      - name: Build all production packages
        run: pnpm build

      - name: Install Chromium for extension checks
        run: pnpm --filter @fillin/extension exec playwright install --with-deps chromium

      - name: Test the installed extension in Chromium
        run: pnpm --filter @fillin/extension test:e2e

      - name: Upload browser test report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: extension-browser-tests
          path: |
            apps/extension/playwright-report/
            apps/extension/test-results/
          if-no-files-found: ignore
          retention-days: 7
